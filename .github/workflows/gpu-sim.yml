name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the aligner and runs the golden-output tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "tools/**"
      - "utils/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The device code is built for sm_90 and also embeds PTX. The shared
      # libwfagpu.so links the shared CUDA runtime, which the simulator needs.
      - name: Build the aligner
        run: |
          make aligner SM=90 COMPUTE=90 \
            NVCC_OPTIONS="-O3 -maxrregcount=64 -gencode arch=compute_90,code=[sm_90,compute_90]"

      # The test scripts print "OK" on success but exit 0 on failure too, so
      # the output is checked. tests/test_api.c (10 K bp pairs, 2 minutes on a
      # real GPU) is not run, and test_packing_kernel.cu is not run either: its
      # packing kernel reads up to 3 bytes past the end of a small buffer.
      - name: Run the aligner tests
        working-directory: tests
        run: |
          status=0
          for t in test-aligner.sh test-fasta.sh; do
            vgpu run bash "$t" 2>&1 | tee "$RUNNER_TEMP/$t.log"
            grep -q "OK ($t)" "$RUNNER_TEMP/$t.log" || status=1
          done
          exit $status
